name: Javid Downloader Android APK

on:
  push:
    branches:
      - feature/javid-downloader-android-v1
    paths:
      - 'JavidDownloader/**'
      - '.github/workflows/javid-downloader-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVID_KEYSTORE_B64: ${{ secrets.JAVID_KEYSTORE_B64 }}
      JAVID_SIGN_PASSWORD: ${{ secrets.JAVID_SIGN_PASSWORD }}
    defaults:
      run:
        working-directory: JavidDownloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          mkdir -p outputs
          if [ -n "$JAVID_KEYSTORE_B64" ] && [ -n "$JAVID_SIGN_PASSWORD" ]; then
            printf '%s' "$JAVID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/javid-release.jks"
            chmod 600 "$RUNNER_TEMP/javid-release.jks"
            export JAVID_SIGNING_STORE_FILE="$RUNNER_TEMP/javid-release.jks"
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk outputs/JavidDownloader-v1.5.2-STABLE-RELEASE.apk
          else
            echo "::warning::Configure GitHub Actions secrets JAVID_KEYSTORE_B64 and JAVID_SIGN_PASSWORD to create stable update APKs"
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release-unsigned.apk outputs/JavidDownloader-v1.5.2-UNSIGNED-FOR-LOCAL-SIGNING.apk
          fi
      - name: Upload APK build
        uses: actions/upload-artifact@v4
        with:
          name: JavidDownloader-v1.5.2-build
          path: JavidDownloader/outputs/*.apk
          if-no-files-found: error
      - name: Provide Android APK signer toolkit
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-apksigner-35
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error

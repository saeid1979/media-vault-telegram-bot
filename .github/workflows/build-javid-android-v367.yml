name: Build JavidDownloader Android APK 3.6.7

on:
  workflow_dispatch:
  push:
    branches:
      - feature/javid-downloader-android-apk-v367

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JAVID_KEYSTORE_B64: ${{ secrets.JAVID_KEYSTORE_B64 }}
      JAVID_SIGN_PASSWORD: ${{ secrets.JAVID_SIGN_PASSWORD }}
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          mkdir -p android-src
          unzip -q android/JavidDownloader-v3.6.7-source.zip -d android-src
          test -f android-src/app/build.gradle
          test -f android-src/app/src/main/java/com/javid/downloader/TelegramBotService.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate rain logic and Java source syntax
        run: |
          cd android-src
          mkdir -p build/syntax build/tests
          javac -d build/syntax tools/JavaSyntaxCheck.java
          java -cp build/syntax JavaSyntaxCheck app/src/main/java/com/javid/downloader/*.java
          javac -d build/tests app/src/main/java/com/javid/downloader/RainProbabilityPolicy.java tools/RainProbabilityPolicyTest.java
          java -cp build/tests com.javid.downloader.RainProbabilityPolicyTest
      - name: Use Android SDK available on Ubuntu runner
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install required Android platform
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK (separate beta app)
        working-directory: android-src
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish beta installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JavidDownloader-v3.6.7-RAIN50-BETA-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare original signing key when available
        if: ${{ env.JAVID_KEYSTORE_B64 != '' && env.JAVID_SIGN_PASSWORD != '' }}
        run: |
          echo "$JAVID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/javid-release.jks"
          chmod 600 "$RUNNER_TEMP/javid-release.jks"
          echo "JAVID_SIGNING_STORE_FILE=$RUNNER_TEMP/javid-release.jks" >> "$GITHUB_ENV"
      - name: Build stable release signed with original key when available
        if: ${{ env.JAVID_KEYSTORE_B64 != '' && env.JAVID_SIGN_PASSWORD != '' }}
        working-directory: android-src
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify original signing certificate when available
        if: ${{ env.JAVID_KEYSTORE_B64 != '' && env.JAVID_SIGN_PASSWORD != '' }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-src/app/build/outputs/apk/release/app-release.apk             | grep -Fqi '653604d1575f9bd2150e25177332e4634b88c732a8f7ee884f82880d88d8ae58'
      - name: Publish stable update only when signature verified
        if: ${{ env.JAVID_KEYSTORE_B64 != '' && env.JAVID_SIGN_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: JavidDownloader-v3.6.7-RAIN50-SIGNED-UPDATE-APK
          path: android-src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

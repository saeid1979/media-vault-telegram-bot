plugins { id 'com.android.application' }

// Sign release builds ONLY with the permanent key kept in GitHub Actions Secrets.
// Never commit private keystores or passwords to source control.
def stableKeyFile = System.getenv('JAVID_SIGNING_STORE_FILE')
def stableKeyPassword = System.getenv('JAVID_SIGN_PASSWORD')
def stableKeyAvailable = stableKeyFile && stableKeyPassword && file(stableKeyFile).isFile()

android {
    namespace 'com.javid.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.javid.downloader'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        stableRelease {
            if (stableKeyAvailable) {
                storeFile file(stableKeyFile)
                storePassword stableKeyPassword
                keyAlias 'javid-release'
                keyPassword stableKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (stableKeyAvailable) {
                signingConfig signingConfigs.stableRelease
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
